<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>业务流程</title>
<style>
  :root {
    --bg: #0b0a12;
    --text: #ece9f6;
    --muted: #a49dbf;
    --dim: #736d8c;
    --line: rgba(255, 255, 255, 0.14);
    --purple: #a78bfa;
    --pink: #f472b6;
    --amber: #fbbf24;
    --cyan: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); height: 100%; }
  body {
    font-family: 'Noto Sans SC Variable', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    color: var(--text);
    padding: clamp(6px, 1.6vw, 16px);
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    height: 100%;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 18px;
    background:
      radial-gradient(900px 400px at 8% -10%, rgba(167, 139, 250, 0.14), transparent 62%),
      radial-gradient(760px 360px at 95% 110%, rgba(244, 114, 182, 0.1), transparent 60%),
      var(--bg);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: 100%; }
  .node { transition: transform 0.25s ease; }
  .node:hover { transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) { .node { transition: none; } }
</style>
</head>
<body>
<div class="frame">
  <svg id="chart" viewBox="0 0 1200 700" role="img" aria-labelledby="t">
    <title id="t">业务流程</title>
  </svg>
</div>

<script>
  const VARIANTS = {
    procurement: {
      title: '工程物资采购与仓储流程',
      note: '从需求到结算，每一步都落在台账上，账实可对。',
      steps: [
        ['需求提报', '项目用料计划'],
        ['招标询价', '文件编制 · 比价'],
        ['到货验收', '进场检查 · 报检'],
        ['入库登记', '数量 · 批次 · 记录'],
        ['领用出库', '需求单 · 工单'],
        ['台账更新', '出入库 · 库存'],
        ['月度对账', '供应商结算'],
      ],
    },
    opinion: {
      title: '舆情监测与研判流程',
      note: '监测不是目的，能在风险扩散前给出判断才是。',
      steps: [
        ['全网监测', '关键词 · 渠道'],
        ['线索溯源', '来源 · 传播路径'],
        ['风险研判', '趋势 · 影响面'],
        ['分级上报', '时效 · 对象'],
        ['报告输出', '日报 · 周报 · 专报'],
        ['处置建议', '口径 · 动作'],
      ],
    },
    city: {
      title: '城市服务产品运营流程',
      note: '从服务商接入到内容运营，一条线打通线上入口。',
      steps: [
        ['服务商对接', '资源 · 合作'],
        ['需求梳理', '场景 · 优先级'],
        ['原型设计', '页面 · 流程'],
        ['应用接入', '联调 · 上线'],
        ['内容运营', '自有平台 · 矩阵'],
        ['数据复盘', '使用 · 反馈'],
      ],
    },
    robot: {
      title: '送餐机器人交付流程',
      note: '现场交付的每一步都要可复现，才算真正验收。',
      steps: [
        ['设备安装', '硬件 · 上电'],
        ['IOT 联网', '网络 · 绑定'],
        ['地图建图', '扫描 · 校准'],
        ['路线调试', '点位 · 避障'],
        ['任务测试', '送餐 · 回充'],
        ['培训交付', '演示 · 交接'],
      ],
    },
  };

  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs = {}) => {
    const node = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    return node;
  };

  const key = new URLSearchParams(location.search).get('v') || 'procurement';
  const data = VARIANTS[key] || VARIANTS.procurement;
  const svg = document.getElementById('chart');
  svg.setAttribute('aria-label', data.title);

  svg.appendChild(el('text', { x: 48, y: 56, 'font-size': 27, 'font-weight': 600, fill: 'var(--text)' }))
    .textContent = data.title;
  svg.appendChild(el('text', { x: 48, y: 86, 'font-size': 13.5, fill: 'var(--muted)' }))
    .textContent = data.note;

  const defs = el('defs');
  const marker = el('marker', {
    id: 'arrow', viewBox: '0 0 10 10', refX: 8, refY: 5,
    markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse',
  });
  marker.appendChild(el('path', {
    d: 'M2 1L8 5L2 9', fill: 'none', stroke: 'context-stroke',
    'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
  }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  const W = 236, H = 96, GAP = 34;
  const rows = [data.steps.slice(0, 4), data.steps.slice(4)];
  const startX = 56;
  const rowY = [206, 418];
  const colors = ['var(--purple)', 'var(--pink)', 'var(--amber)', 'var(--cyan)'];

  const positions = [];
  rows.forEach((row, r) => {
    row.forEach((step, i) => {
      const col = r === 0 ? i : 3 - i;
      const x = startX + col * (W + GAP);
      positions.push({ x, y: rowY[r], index: r * 4 + i });
    });
  });

  const group = el('g');
  positions.forEach(({ x, y, index }) => {
    const [name, sub] = data.steps[index];
    const color = colors[index % colors.length];
    const g = el('g', { class: 'node' });
    g.appendChild(el('rect', {
      x, y, width: W, height: H, rx: 12,
      fill: 'rgba(255,255,255,0.04)', stroke: 'rgba(255,255,255,0.13)', 'stroke-width': 0.8,
    }));
    g.appendChild(el('rect', { x, y, width: 4, height: H, rx: 2, fill: color }));
    g.appendChild(el('text', {
      x: x + 24, y: y + 36, 'font-size': 15.5, 'font-weight': 600, fill: 'var(--text)',
    })).textContent = name;
    g.appendChild(el('text', {
      x: x + 24, y: y + 62, 'font-size': 12, fill: 'var(--muted)',
    })).textContent = sub;
    const num = el('text', {
      x: x + W - 18, y: y + 30, 'font-size': 11.5, fill: 'var(--dim)', 'text-anchor': 'end',
      'font-family': 'ui-monospace, Consolas, monospace',
    });
    num.textContent = String(index + 1).padStart(2, '0');
    g.appendChild(num);
    group.appendChild(g);
  });

  positions.slice(0, -1).forEach((from, i) => {
    const to = positions[i + 1];
    let d;
    if (from.y === to.y) {
      const dir = to.x > from.x ? 1 : -1;
      d = `M${from.x + (dir > 0 ? W : 0)} ${from.y + H / 2} L${to.x + (dir > 0 ? 0 : W)} ${to.y + H / 2}`;
    } else {
      const sx = from.x + W / 2;
      const tx = to.x + W / 2;
      d = `M${sx} ${from.y + H} L${sx} ${to.y - 24} L${tx} ${to.y - 24} L${tx} ${to.y}`;
    }
    group.appendChild(el('path', {
      d, fill: 'none', stroke: 'var(--line)', 'stroke-width': 1.5, 'marker-end': 'url(#arrow)',
    }));
  });
  svg.appendChild(group);

  svg.appendChild(el('text', {
    x: 48, y: 648, 'font-size': 11.5, fill: 'var(--dim)',
  })).textContent = '流程按实际业务顺序整理，节点可对应到台账或交付记录。';
</script>
</body>
</html>
