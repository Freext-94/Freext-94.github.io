name: 构建并部署到 GitHub Pages

on:
  # 推送到主分支时重新构建（Notion 内容改了也要重新构建才会生效）
  push:
    branches: [main]
  # 每天 UTC 18:00（北京时间 02:00）自动同步一次 Notion 内容
  #schedule:
  #  - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 拆成显式步骤而不是用 withastro/action，这样每一步的结论都能从
      # Actions API 单独读到；配置缺失会写成 annotation，日志里一眼可见
      - name: 检查 Notion 配置
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PROFILE_ID: ${{ vars.NOTION_PROFILE_ID }}
          NOTION_PROJECTS_ID: ${{ vars.NOTION_PROJECTS_ID }}
          NOTION_SKILLS_ID: ${{ vars.NOTION_SKILLS_ID }}
          NOTION_EXPERIENCE_ID: ${{ vars.NOTION_EXPERIENCE_ID }}
          NOTION_ARTICLES_ID: ${{ vars.NOTION_ARTICLES_ID }}
        run: |
          missing=""
          [ -z "$NOTION_API_KEY" ] && missing="$missing NOTION_API_KEY[Secret]"
          for v in NOTION_PROFILE_ID NOTION_PROJECTS_ID NOTION_SKILLS_ID \
                   NOTION_EXPERIENCE_ID NOTION_ARTICLES_ID; do
            [ -z "${!v}" ] && missing="$missing ${v}[Variable]"
          done
          if [ -n "$missing" ]; then
            echo "::error::CI 缺少配置:${missing} —— 请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          echo "Notion 配置齐全，node $(node -v)"

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx astro check

      - name: 构建站点
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PROFILE_ID: ${{ vars.NOTION_PROFILE_ID }}
          NOTION_PROJECTS_ID: ${{ vars.NOTION_PROJECTS_ID }}
          NOTION_SKILLS_ID: ${{ vars.NOTION_SKILLS_ID }}
          NOTION_EXPERIENCE_ID: ${{ vars.NOTION_EXPERIENCE_ID }}
          NOTION_ARTICLES_ID: ${{ vars.NOTION_ARTICLES_ID }}
          # Canva 封面截图需要 Chrome，runner 自带
          CHROME_PATH: /usr/bin/google-chrome
        # 先跑 sync-canva-covers 再构建，不能用 npx astro build 跳过这一步
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
