name: 构建并部署到 GitHub Pages

on:
  # 推送到主分支时重新构建（Notion 内容改了也要重新构建才会生效）
  push:
    branches: [main]
  # 每天 UTC 18:00（北京时间 02:00）自动同步一次 Notion 内容
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 这个 action 内部已经做了 actions/upload-pages-artifact，
      # 不要再手动加一遍，否则会产生两个 artifact 让 deploy 步骤无所适从
      - name: 构建站点
        uses: withastro/action@v3
        with:
          # 该 action 默认装 Node 20，而 Astro 7.4 要求 >= 22.23.4
          node-version: '22'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # 数据库 ID 不算机密，建议放在 Settings → Secrets and variables → Actions → Variables
          NOTION_PROFILE_ID: ${{ vars.NOTION_PROFILE_ID }}
          NOTION_PROJECTS_ID: ${{ vars.NOTION_PROJECTS_ID }}
          NOTION_SKILLS_ID: ${{ vars.NOTION_SKILLS_ID }}
          NOTION_EXPERIENCE_ID: ${{ vars.NOTION_EXPERIENCE_ID }}
          NOTION_ARTICLES_ID: ${{ vars.NOTION_ARTICLES_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
